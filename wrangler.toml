# ---------------------------------------------------------------------------
# ACTIVE LIFE QUEST - CLOUDFLARE PAGES PROJECT ONLY. NOT A WORKER.
# ---------------------------------------------------------------------------
# This file is for a Cloudflare Pages project. It is NOT a Worker config.
#
# DO NOT create a Cloudflare Worker for this app, and DO NOT run
# `npx wrangler deploy` or `wrangler deploy`. A Worker has no entrypoint
# here (there is no `main`), so `wrangler deploy` fails at the Deploying
# step, and the Worker serves the Cloudflare placeholder
# "There is nothing here yet" at a *.workers.dev address.
#
# The API lives in functions/api/[[path]].ts. That is a Pages Function.
# Pages Functions only run on a Pages project. On a Worker they never run.
#
# Correct setup (see DEPLOY.md for the full plain-language steps):
#   1. Delete the wrong Worker project in Cloudflare, if one was made.
#   2. In Cloudflare, Workers & Pages > Create, and pick the PAGES option
#      (in the current wizard it is a button near the bottom of the Create
#      page, not the big Worker option at the top).
#   3. Connect GitHub repo derhoff62/active-life-quest.
#   4. Build command: npm run build
#      Build output directory: dist
#      Deploy command: leave EMPTY. Do not put `npx wrangler deploy` here.
#      A Pages project deploys the dist folder itself.
#   5. Set the environment variables in the Pages project's Settings.
#   6. The live address must end in .pages.dev, never .workers.dev.
#      If the address ends in .workers.dev, it is a Worker, not Pages:
#      delete it and start again at step 2.
# ---------------------------------------------------------------------------

name = "active-life-quest"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Secrets and environment variables. Do NOT put real values in this file.
# Set these in the Cloudflare dashboard under Pages > active-life-quest > Settings > Variables and secrets,
# or with `wrangler pages secret put <NAME>`:
#   DATABASE_URL       Neon Postgres connection string (required for all DB endpoints)
#   SESSION_SECRET     Long random string, set now and kept in reserve for
#                      future signed cookies. Sessions in v1 are opaque
#                      random ids stored in the sessions table.
#   COACH_PIN_HASH     Leave blank at first deploy. Derek sets the Coach PIN on first
#                      Coach sign-in; the API stores its hash in the settings table.
#   BETA_CODE          Beta code, e.g. ACTIVEBETA
#   BETA_USES          Beta code max uses, e.g. 25
#   BETA_EXPIRES       Beta code expiry date, e.g. 2027-02-19
