# ---------------------------------------------------------------------------
# ACTIVE LIFE QUEST - CLOUDFLARE WORKER (primary) + PAGES (also supported)
# ---------------------------------------------------------------------------
# This app deploys as a Cloudflare Worker. That is the flow Derek uses:
# Workers & Pages > Create > Worker > Connect to Git > derhoff62/active-life-quest.
# The Worker serves the built React app from dist/ (Workers Static Assets)
# AND the Hono API under /api/*, both from one entry point.
#
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Preview command: npx wrangler preview
#   Live address:    *.workers.dev (for example
#                    active-life-quest.derhoff62.workers.dev)
#
# How it works:
#   - main = "src/worker.ts" is the Worker entry point.
#   - [assets] serves dist/ as static assets, with the ASSETS binding so
#     the Worker can fetch files and fall back to index.html for the
#     single-page app. run_worker_first = true routes every request
#     through the Worker first, which then serves /api/* from the Hono
#     app and everything else from the ASSETS binding.
#   - The API logic is NOT in the Worker file. It lives in
#     src/server/api.ts and is shared with the Pages Function in
#     functions/api/[[path]].ts, so there is one copy of the logic.
#   - pages_build_output_dir is deliberately NOT in this file. In
#     Wrangler 3, that key makes Wrangler treat the project as a Pages
#     project, which rejects the ASSETS binding name and the Worker
#     assets config. The Pages fallback still works: `wrangler pages
#     deploy dist` passes the output directory on the command line,
#     and a Pages project created in the dashboard asks for it there.
# ---------------------------------------------------------------------------

name = "active-life-quest"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Videos are DEFERRED (Nov 22, 2026, Derek: "Can we worry about the
# videos later?"). The R2 binding below was TEMPORARILY REMOVED so
# deploys work without the R2 bucket, which does not exist yet and
# could not be created (Cloudflare dashboard sign-in fails from the
# Muse browser). All video upload code and UI stay in place: with no
# VIDEOS binding the endpoints return a plain 503 "Video storage is
# not set up yet" and the assessment / check-in / message still finish
# fine without a video. No video bytes ever go in the Neon profile JSON.
# TO RE-ENABLE VIDEOS: first create the bucket in the Cloudflare
# dashboard (Storage & databases > R2, enable R2, create a bucket named
# exactly active-life-quest-videos), then uncomment this block and
# redeploy.
# [[r2_buckets]]
# binding = "VIDEOS"
# bucket_name = "active-life-quest-videos"

# Secrets and environment variables. Do NOT put real values in this file.
# Set these in the Cloudflare dashboard under Workers & Pages >
# active-life-quest > Settings > Variables and secrets,
# or with `wrangler secret put <NAME>`:
#   DATABASE_URL       Neon Postgres connection string (required for all DB endpoints)
#   SESSION_SECRET     Long random string, set now and kept in reserve for
#                      future signed cookies. Sessions in v1 are opaque
#                      random ids stored in the sessions table.
#   COACH_PIN_HASH     Leave blank at first deploy. Derek sets the Coach PIN on first
#                      Coach sign-in; the API stores its hash in the settings table.
#   BETA_CODE          Beta code, e.g. ACTIVEBETA
#   BETA_USES          Beta code max uses, e.g. 25
#   BETA_EXPIRES       Beta code expiry date, e.g. 2027-02-19
